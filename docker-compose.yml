name: arogyakhosh

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arogyakhosh}
      POSTGRES_USER: ${POSTGRES_USER:-arogya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arogya}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-arogya}" -d "${POSTGRES_DB:-arogyakhosh}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./services/backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      GIN_MODE: ${GIN_MODE:-release}
      DATABASE_URL: postgres://${POSTGRES_USER:-arogya}:${POSTGRES_PASSWORD:-arogya}@postgres:5432/${POSTGRES_DB:-arogyakhosh}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - see .env.example}
      JWT_ISSUER: ${JWT_ISSUER:-arogyakhosh}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-records}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./services/frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
