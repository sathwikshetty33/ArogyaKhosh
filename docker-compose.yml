name: arogyakhosh

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arogyakhosh}
      POSTGRES_USER: ${POSTGRES_USER:-arogya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arogya}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER:-arogya}" -d "${POSTGRES_DB:-arogyakhosh}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
